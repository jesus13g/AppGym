[project]
name = "AppGym"
version = "1.0.0"
description = "Gestión y revisión de rutinas de gimnasio"
# Estas son las dependencias que se empaquetan dentro de la app móvil.
# requirements.txt lleva además las de escritorio y las del propio build, que en
# un APK no pintan nada (y no tienen ruedas para Android).
dependencies = [
    "flet==0.25.2",
    "SQLAlchemy==2.0.37",
    "requests==2.32.3",
]

[tool.flet]
org = "com.jesus13g"
product = "AppGym"
company = "jesus13g"
copyright = "© jesus13g"

[tool.flet.android]
# La app descarga las imágenes de los ejercicios del repositorio original.
permission = { "android.permission.INTERNET" = true }
