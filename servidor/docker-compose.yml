# El despliegue entero: la base, la API y el proxy que resuelve el TLS.
#
# `docker compose up -d` y ya está. En el VPS, con el dominio en el .env; en
# local, con APPGYM_DOMINIO=localhost, que hace que Caddy use su CA interna.
#
# **La API no publica ningún puerto.** Solo la alcanza Caddy por la red interna,
# así que no hay forma de hablar con ella en claro saltándose el TLS. Es también
# lo que hace fiable la cabecera `X-Forwarded-For` que lee el límite de
# peticiones: el único que puede ponerla es el proxy.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appgym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?hace falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: appgym
    volumes:
      - datos:/var/lib/postgresql/data
      # Las copias las deja aquí el cron del anfitrión; ver README.md.
      - ./copias:/copias
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appgym -d appgym"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APPGYM_BD_URL: postgresql+asyncpg://appgym:${POSTGRES_PASSWORD}@db:5432/appgym
      APPGYM_JWT_SECRETO: ${APPGYM_JWT_SECRETO:?hace falta APPGYM_JWT_SECRETO en el .env}
      APPGYM_REGISTRO_ABIERTO: ${APPGYM_REGISTRO_ABIERTO:-true}
      APPGYM_ACCESO_MINUTOS: ${APPGYM_ACCESO_MINUTOS:-15}
      APPGYM_REFRESCO_DIAS: ${APPGYM_REFRESCO_DIAS:-60}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/salud')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APPGYM_DOMINIO: ${APPGYM_DOMINIO:?hace falta APPGYM_DOMINIO en el .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # El certificado y su clave viven aquí. **Este volumen hay que conservarlo**:
      # perderlo significa pedir certificados nuevos, y con anclaje por hoja eso
      # deja a la app fuera hasta publicar un APK.
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  datos:
  caddy_datos:
  caddy_config:
