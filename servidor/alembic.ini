[alembic]
script_location = migraciones
prepend_sys_path = .
path_separator = os
# La URL no se escribe aquí: la lee `migraciones/env.py` de APPGYM_BD_URL, que es
# la misma variable que usa el servidor. Dos sitios donde poner la base de datos
# es un sitio de más donde equivocarse.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
