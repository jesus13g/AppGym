name: Construir APK

# Genera un APK instalable en Android y lo publica como release,
# para poder probar la app sin tener un ordenador delante.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flet-cli
        run: pip install flet-cli==0.25.2

      # --split-per-abi generaría varios APK; uno universal es más simple de
      # instalar a mano aunque pese algo más.
      - name: Construir APK
        run: flet build apk --verbose --build-version "1.0.$GITHUB_RUN_NUMBER" --build-number "$GITHUB_RUN_NUMBER"

      - name: Renombrar el APK
        run: |
          mkdir -p dist
          find build/apk -name '*.apk' -exec cp {} dist/AppGym.apk \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AppGym-apk
          path: dist/AppGym.apk

      # La release da un enlace directo al .apk, que desde el móvil es mucho más
      # cómodo que el artifact (que se descarga en un .zip).
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-preview --yes --cleanup-tag || true
          gh release create apk-preview dist/AppGym.apk \
            --title "AppGym — APK de prueba" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "APK de la rama \`${GITHUB_REF_NAME}\` (build ${GITHUB_RUN_NUMBER}).

          Descárgalo desde el móvil y ábrelo para instalarlo. Android pedirá permiso
          para instalar apps de origen desconocido la primera vez.

          Sin firmar con una clave propia: es una compilación de prueba."
