name: Construir APK

# Comprueba el proyecto y genera un APK instalable en Android, para poder
# probar la app sin tener un ordenador delante.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"

permissions:
  contents: write

env:
  # Debe coincidir con la versión con la que se desarrolla; ver CLAUDE.md.
  FLUTTER_VERSION: "3.44.8"

jobs:
  # Análisis y tests van en su propio job: son rápidos y no necesitan el SDK de
  # Android, así que dan el veredicto mucho antes que la compilación del APK.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Los *.g.dart no se versionan (ver .gitignore), así que aquí hay que
      # generarlos antes de analizar o no compilaría nada.
      - name: Generar el código de drift
        run: dart run build_runner build

      - name: Comprobar el formato
        run: dart format --set-exit-if-changed lib test

      - name: Analizar
        run: flutter analyze

      - name: Tests
        run: flutter test

  apk:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar el código de drift
        run: dart run build_runner build

      # --split-per-abi generaría varios APK; uno universal es más simple de
      # instalar a mano aunque pese algo más.
      - name: Construir APK
        run: |
          flutter build apk --release \
            --build-name "1.0.$GITHUB_RUN_NUMBER" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Renombrar el APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AppGym.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AppGym-apk
          path: dist/AppGym.apk

      # La release da un enlace directo al .apk, que desde el móvil es mucho más
      # cómodo que el artifact (que se descarga en un .zip).
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-preview --yes --cleanup-tag || true
          gh release create apk-preview dist/AppGym.apk \
            --title "AppGym — APK de prueba" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "APK de la rama \`${GITHUB_REF_NAME}\` (build ${GITHUB_RUN_NUMBER}).

          Descárgalo desde el móvil y ábrelo para instalarlo. Android pedirá permiso
          para instalar apps de origen desconocido la primera vez.

          Sin firmar con una clave propia: es una compilación de prueba."
